services:
  - type: web
    name: node-badges
    plan: starter
    runtime: node
    repo: https://github.com/smashedr/node-badges
    autoDeployTrigger: off
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /app-health-check
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: node-badges-redis
          property: connectionString

  - type: keyvalue
    name: node-badges-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: volatile-ttl
