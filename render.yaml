services:
  - type: web
    name: node-badges
    repo: https://github.com/smashedr/node-badges
    plan: free
    runtime: docker
    startCommand: npm start
    dockerContext: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: REDIS_URL
        sync: true
    healthCheckPath: /app-health-check

databases:
  - type: keyvalue
    name: node-badges-redis
    plan: free
    access:
      internal: true
