services:
  - type: web
    name: node-badges
    image: ghcr.io/smashedr/node-badges:latest
    plan: free
    runtime: image
    dockerCommand: npm start
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: node-badges-redis
          property: connectionString
    healthCheckPath: /app-health-check

  - type: keyvalue
    name: node-badges-redis
    plan: free
    maxmemoryPolicy: volatile-ttl
    ipAllowList: []
